  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  section_order: [".text", ".data", ".rodata", ".lit4", ".sdata", ".sbss", ".bss"]
  o_as_suffix: True
  ld_bss_is_noload: True
  emit_subalign: False
  ld_align_segment_vram_end: False
  ld_align_section_vram_end: False
  ld_generate_symbol_per_data_segment: True

segments:
  # ELF file header + 3 program headers at 0x34, then zeros to the first loaded
  # page; not loaded. The retail ELF keeps its section headers, so the file also
  # has a trailer segment (below) that no program header covers.
  - [0x0, bin, elf_header]

  - name: main
    type: code
    align: 1
    start: 0x1000
    vram: 0x100000
    # vram_end = vram + (rom_end - rom_start) + bss_size must land on .vubss
    # (0x005A0330), the end of .bss and of PT_LOAD[2]'s memsz.
    bss_size: 0x4E7DC
    subsegments:
      # No TU recovery yet: .text is one unit per splat's own file boundaries.
      # The first splat run reports candidate boundaries (find_file_boundaries);
      # each confirmed one becomes another c subsegment named code_<vram>.
      - [0x1000, asm, hand/crt0]  # 8 pad bytes, _start (0x100008, clears all 128-bit GPRs), 2 stubs; ends where dds3FirstInit begins, as in DDS
      # .vutext (0x002E6E50, 0xE7B0): VU1 microcode, never EE code. The 12 zero
      # bytes of .text tail padding before it fall at the end of the unit above.
