# SDFSDMAN.IRX, the sound driver. See docs/irx-modules.md.
name: SDFSDMAN.IRX
sha1: 54e04fcb62dbf858ad7b30d68ef321bc03fb4b02

# The fields tools/irx.py writes into .iopmod. Everything else in the
# container is derived from the link.
module:
  name: sdf_sound_driver
  version: 0x0000
  entry: sdfSdManInit

paths:
  target: orig/irx/SDFSDMAN.IRX
  asm: asm/irx/SDFSDMAN
  src: src/irx/SDFSDMAN.c
  build: build/irx/SDFSDMAN
  symbols: config/SDFSDMAN/symbol_addrs.txt
