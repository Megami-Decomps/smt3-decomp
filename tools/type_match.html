<title>Type match</title>
<style>
  :root {
    --bg: #14161a; --panel: #1b1e24; --line: #2b303a; --ink: #d7dbe3;
    --dim: #8b93a3; --ok: #5bc98f; --warn: #d9a84b; --bad: #d96b6b;
    --pick: #6aa6ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  header { display: flex; gap: 16px; align-items: baseline; padding: 8px 12px;
           border-bottom: 1px solid var(--line); position: sticky; top: 0;
           background: var(--bg); z-index: 2; }
  header b { font-size: 15px; }
  .grow { flex: 1; }
  .keys { color: var(--dim); font-size: 12px; }
  main { display: grid; grid-template-columns: 240px 1fr; height: calc(100vh - 41px); }
  #list { overflow: auto; border-right: 1px solid var(--line); }
  #list div { padding: 3px 10px; cursor: pointer; white-space: nowrap;
              overflow: hidden; text-overflow: ellipsis; }
  #list div.on { background: var(--panel); color: #fff; box-shadow: inset 2px 0 var(--pick); }
  #list div .tag { float: right; color: var(--dim); }
  #list div.done .tag { color: var(--ok); }
  #list div.left .tag { color: var(--warn); }
  #work { overflow: auto; padding: 12px 14px 60px; }
  h2 { margin: 0 0 2px; font-size: 16px; }
  .meta { color: var(--dim); margin-bottom: 10px; }
  .cands { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .cand { border: 1px solid var(--line); background: var(--panel); padding: 4px 8px;
          cursor: pointer; border-radius: 3px; }
  .cand.on { border-color: var(--pick); color: #fff; }
  .cand .n { color: var(--dim); margin-right: 6px; }
  .cand .k { color: var(--dim); margin-left: 6px; font-size: 11px; }
  .cand.auto { border-left: 3px solid var(--ok); }
  .held { color: var(--warn); }
  table { border-collapse: collapse; width: 100%; max-width: 1100px; }
  th, td { text-align: left; padding: 1px 8px 1px 0; white-space: nowrap; }
  th { color: var(--dim); font-weight: normal; border-bottom: 1px solid var(--line); }
  td.off { color: var(--dim); }
  tr.exact td.r { color: var(--ok); }
  tr.shifted td.r { color: var(--warn); }
  tr.only td.r, tr.only td.l { color: var(--bad); }
  .why { margin: 8px 0 14px; }
  .why li { color: var(--dim); }
  .ev { color: var(--ink); }
  .none { color: var(--dim); padding: 20px 0; }
  .sep { border-left: 1px solid var(--line); padding-left: 10px; }
  pre.src { background: var(--panel); border: 1px solid var(--line); padding: 8px 10px;
            margin: 0 0 14px; max-width: 1100px; overflow: auto; color: var(--dim);
            max-height: 230px; }
  #find { position: fixed; inset: 60px auto auto 50%; transform: translateX(-50%);
          width: 520px; background: var(--panel); border: 1px solid var(--pick);
          padding: 8px; display: none; z-index: 3; }
  #find input { width: 100%; background: var(--bg); color: var(--ink); font: inherit;
                border: 1px solid var(--line); padding: 5px 7px; }
  #find div { padding: 2px 6px; cursor: pointer; }
  #find div.on { background: var(--bg); color: #fff; }
  #find .k { color: var(--dim); float: right; }
</style>

<header>
  <b>Type match</b>
  <span id="count" class="keys"></span>
  <span class="grow"></span>
  <span class="keys">j/k type &nbsp; &larr;/&rarr; candidate &nbsp; <b>enter</b> take
    &nbsp; <b>s</b> leave alone &nbsp; <b>x</b> clear &nbsp; <b>n</b> next undecided
    &nbsp; <b>/</b> search every record</span>
</header>
<div id="find">
  <input id="q" placeholder="record name, then enter to take it" autocomplete="off" oninput="drawHits()">
  <div id="hits"></div>
</div>
<main>
  <div id="list"></div>
  <div id="work"></div>
</main>

<script>
let TYPES = [], INDEX = [], DEC = {}, ti = 0, ci = 0;
let finding = false, hits = [], hi = 0, preview = null;

const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const hex = n => '0x' + n.toString(16).toUpperCase().padStart(3, '0');

function load() {
  fetch('/api/types').then(r => r.json()).then(d => {
    TYPES = d.types; INDEX = d.index || []; DEC = d.decisions || {};
    draw();
  });
}

function post(body) {
  return fetch('/api/decide', {method: 'POST', body: JSON.stringify(body)}).then(r => r.json());
}

function take(name, kind) {
  const t = TYPES[ti];
  if (!name) {
    const c = t.candidates[ci];
    if (!c) return;
    name = c.name; kind = c.kind;
  }
  DEC[t.type] = {target: name, kind: kind, note: ''};
  post({type: t.type, target: name, kind: kind}).then(() => { preview = null; next(true); });
}

// Searching the whole pool, for the record the ranking did not float up.
function openFind() {
  finding = true; hi = 0;
  document.getElementById('find').style.display = 'block';
  const q = document.getElementById('q');
  q.value = ''; q.focus(); drawHits();
}

function closeFind() {
  finding = false;
  document.getElementById('find').style.display = 'none';
  document.getElementById('q').blur();
}

function drawHits() {
  const s = document.getElementById('q').value.toLowerCase();
  hits = !s ? [] : INDEX.filter(r => r.name.toLowerCase().includes(s)).slice(0, 12);
  hi = Math.min(hi, Math.max(hits.length - 1, 0));
  document.getElementById('hits').innerHTML = hits.map((r, i) =>
    `<div class="${i === hi ? 'on' : ''}" onmousedown="hi=${i};pickHit()">${esc(r.name)}
      <span class="k">${r.size}B · ${r.members}m · ${r.kind} · ${r.source}</span></div>`).join('');
}

function pickHit() {
  const r = hits[hi];
  if (!r) return;
  closeFind();
  // Show it against ours before it is taken.
  fetch('/api/record?name=' + encodeURIComponent(r.name)).then(x => x.json()).then(rec => {
    preview = {name: r.name, kind: r.kind, source: r.source, score: '—',
               why: ['found by search, ' + r.size + ' bytes, ' + r.members + ' members'],
               rows: rec.rows, evidence: ''};
    const t = TYPES[ti];
    t.candidates = [preview, ...t.candidates.filter(c => c.name !== r.name)];
    ci = 0; draw();
  });
}

function leave() {
  const t = TYPES[ti];
  DEC[t.type] = {target: '', kind: 'skip', note: ''};
  post({type: t.type, target: '', kind: 'skip'}).then(() => { next(true); });
}

function clear() {
  const t = TYPES[ti];
  delete DEC[t.type];
  post({type: t.type, clear: true}).then(draw);
}

function next(undecidedOnly) {
  for (let step = 1; step <= TYPES.length; step++) {
    const j = (ti + step) % TYPES.length;
    if (!undecidedOnly || !DEC[TYPES[j].type]) { ti = j; ci = 0; draw(); return; }
  }
  draw();
}

function rowsFor(t, c) {
  // One row per offset either side uses, so a field with no counterpart shows a gap.
  const offs = new Set();
  t.rows.forEach(r => offs.add(r[0]));
  if (c) c.rows.forEach(r => offs.add(r[0]));
  const mine = new Map(t.rows.map(r => [r[0], r]));
  const theirs = c ? new Map(c.rows.map(r => [r[0], r])) : new Map();
  return [...offs].sort((a, b) => a - b).map(o => {
    const a = mine.get(o), b = theirs.get(o);
    let cls = 'only';
    if (a && b) cls = a[1] === b[1] ? 'exact' : 'shifted';
    return {o, a, b, cls};
  });
}

function draw() {
  const done = Object.values(DEC).filter(d => d.target).length;
  const seen = Object.keys(DEC).length;
  document.getElementById('count').textContent =
    `${TYPES.length} types · ${done} matched · ${seen - done} left alone · ${TYPES.length - seen} to go`;

  document.getElementById('list').innerHTML = TYPES.map((t, i) => {
    const d = DEC[t.type];
    const cls = ['', i === ti ? 'on' : '', d ? (d.target ? 'done' : 'left') : ''].join(' ');
    const tag = d ? (d.target ? '✓' : '–') : (t.candidates.length ? t.candidates.length : '0');
    return `<div class="${cls}" onclick="ti=${i};ci=0;draw()">${esc(t.type)}<span class="tag">${tag}</span></div>`;
  }).join('');

  const t = TYPES[ti];
  if (!t) { document.getElementById('work').innerHTML = '<p class="none">nothing to match</p>'; return; }
  const c = t.candidates[ci];
  const d = DEC[t.type];

  const cands = t.candidates.length
    ? t.candidates.map((x, i) => `<div class="cand ${i === ci ? 'on' : ''} ${x.kind === 'merge' && !x.held ? 'auto' : ''}" onclick="ci=${i};draw()">
        <span class="n">${i + 1}</span>${esc(x.name)}<span class="k">${x.score} · ${x.kind} · ${x.source}</span></div>`).join('')
    : '<span class="none">no candidate scored above zero</span>';

  const table = `<table><tr><th>offset</th><th>ours</th><th class="sep">${c ? esc(c.name) : '—'}</th></tr>` +
    rowsFor(t, c).map(r => `<tr class="${r.cls}">
        <td class="off">${hex(r.o)}</td>
        <td class="l">${r.a ? esc(r.a[2]) + ' ' + esc(r.a[3]) + ' <span class="off">(' + r.a[1] + ')</span>' : ''}</td>
        <td class="r sep">${r.b ? esc(r.b[2]) + ' ' + esc(r.b[3]) + ' <span class="off">(' + r.b[1] + ')</span>' : ''}</td>
      </tr>`).join('') + '</table>';

  document.getElementById('work').innerHTML = `
    <h2>${esc(t.type)} <span class="meta">${t.size} bytes, ${t.rows.length} members</span></h2>
    <div class="meta">${t.files.map(esc).join('  ')}${t.users.length ? '<br>used by ' + t.users.slice(0, 6).map(esc).join(', ') : ''}</div>
    <div class="cands">${cands}</div>
    ${t.source ? `<pre class="src">${esc(t.source)}</pre>` : ''}
    ${c ? `<ul class="why">${c.why.map(w => '<li>' + esc(w) + '</li>').join('')}
      ${c.held ? '<li class="held">hd_merge would refuse this: ' + esc(c.held) + '</li>' : ''}
      ${c.kind === 'merge' && !c.held ? '<li class="ev">hd_merge applies this as it stands</li>' : ''}
      ${c.evidence ? '<li class="ev">' + esc(c.evidence) + '</li>' : ''}</ul>` : ''}
    ${d ? `<div class="meta">decided: ${d.target ? esc(d.target) + ' (' + esc(d.kind) + ')' : 'left alone'} — x to clear</div>` : ''}
    ${table}`;
}

addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (finding) {
    if (e.key === 'Escape') closeFind();
    else if (e.key === 'Enter') pickHit();
    else if (e.key === 'ArrowDown') { hi = Math.min(hi + 1, hits.length - 1); drawHits(); }
    else if (e.key === 'ArrowUp') { hi = Math.max(hi - 1, 0); drawHits(); }
    else return;
    e.preventDefault();
    return;
  }
  if (e.key === '/') { openFind(); e.preventDefault(); return; }
  const t = TYPES[ti];
  if (e.key === 'j') { ti = Math.min(ti + 1, TYPES.length - 1); ci = 0; draw(); }
  else if (e.key === 'k') { ti = Math.max(ti - 1, 0); ci = 0; draw(); }
  else if (e.key === 'ArrowRight' || e.key === 'l') { if (t) ci = Math.min(ci + 1, t.candidates.length - 1); draw(); }
  else if (e.key === 'ArrowLeft' || e.key === 'h') { ci = Math.max(ci - 1, 0); draw(); }
  else if (e.key === 'ArrowDown') { ti = Math.min(ti + 1, TYPES.length - 1); ci = 0; draw(); }
  else if (e.key === 'ArrowUp') { ti = Math.max(ti - 1, 0); ci = 0; draw(); }
  else if (e.key === 'Enter') take();
  else if (e.key === 's') leave();
  else if (e.key === 'x') clear();
  else if (e.key === 'n') next(true);
  else if (e.key >= '1' && e.key <= '9') { ci = Math.min(+e.key - 1, (t?.candidates.length || 1) - 1); draw(); }
  else return;
  e.preventDefault();
});

load();
</script>
